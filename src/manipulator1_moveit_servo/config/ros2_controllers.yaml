# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    Arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    servo_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

Arm_controller:
  ros__parameters:
    joints:
      - base_link_j_base_plate
      - side_plate1_j_side_plate12
      - motor_holder_j_side_plate_12
      - link3_j_bevel1
      - bevel1_j_bevel_coupler
      - bevel_coupler_j_bevel3
      - bevel_coupler_j_bevel2
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
servo_velocity_controller:
  ros__parameters:
    joints:
      - base_link_j_base_plate
      - side_plate1_j_side_plate12
      - motor_holder_j_side_plate_12
      - link3_j_bevel1
      - bevel1_j_bevel_coupler
      - bevel_coupler_j_bevel3
      - bevel_coupler_j_bevel2
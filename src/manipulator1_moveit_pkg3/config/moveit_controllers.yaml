# MoveIt uses this configuration for controller management
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - Arm_controller
    - Gripper_controller

  Arm_controller:
    type: FollowJointTrajectory
    joints:
      - base_link_j_base_plate
      - side_plate1_j_side_plate12
      - motor_holder_j_side_plate_12
      - link3_j_bevel1                 # <-- ADDED
      - bevel1_j_bevel_coupler         # <-- ADDED
      - bevel_coupler_j_bevel3         # <-- ADDED
    action_ns: Arm_controller/follow_joint_trajectory  # <-- UPDATED
    default: true

  Gripper_controller:
    type: FollowJointTrajectory
    joints:
      - servo_J_gl1
    action_ns: Gripper_controller/follow_joint_trajectory # <-- UPDATED
    default: true
